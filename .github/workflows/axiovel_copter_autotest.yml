name: Axiovel Copter autotest

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  copter-sitl:
    name: Copter SITL tests1a
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, axio-sitl]
    timeout-minutes: 180
    container:
      image: ardupilot/ardupilot-dev-base:v0.1.3
      options: --privileged --cap-add=SYS_PTRACE --security-opt apparmor=unconfined --security-opt seccomp=unconfined

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Register problem matchers
        run: |
          echo "::add-matcher::.github/problem-matchers/gcc.json"
          echo "::add-matcher::.github/problem-matchers/python.json"
          echo "::add-matcher::.github/problem-matchers/autotestwarn.json"
          echo "::add-matcher::.github/problem-matchers/autotestfail.json"

      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        run: |
          NOW=$(date -u +"%F-%T")
          echo "timestamp=${NOW}" >> "$GITHUB_OUTPUT"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ github.workflow }}-ccache-base-sitl-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
          restore-keys: |
            ${{ github.workflow }}-ccache-base-sitl-
            ${{ github.workflow }}-ccache-base-

      - name: Setup ccache
        run: |
          . .github/workflows/ccache.env

      - name: Run Copter SITL autotest shard
        env:
          CI_BUILD_TARGET: sitltest-copter-tests1a
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          PATH="/github/home/.local/bin:$PATH"
          Tools/scripts/build_ci.sh

      - name: Upload SITL failure artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fail-copter-sitl-tests1a
          path: |
            /tmp/buildlogs
            ${{ github.workspace }}/logs
            ${{ github.workspace }}/ap-*.core
            ${{ github.workspace }}/core.*
            ${{ github.workspace }}/dumpstack.sh_*
            ${{ github.workspace }}/dumpcore.sh_*
          retention-days: 14

  axiolight-build:
    name: AxioLight Copter build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, axio-sitl]
    timeout-minutes: 90
    container: ardupilot/ardupilot-dev-chibios:v0.1.3

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Register problem matchers
        run: |
          echo "::add-matcher::.github/problem-matchers/gcc.json"
          echo "::add-matcher::.github/problem-matchers/python.json"

      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        run: |
          NOW=$(date -u +"%F-%T")
          echo "timestamp=${NOW}" >> "$GITHUB_OUTPUT"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ github.workflow }}-ccache-chibios-axiolight-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
          restore-keys: |
            ${{ github.workflow }}-ccache-chibios-axiolight-
            ${{ github.workflow }}-ccache-chibios-

      - name: Setup ccache
        run: |
          . .github/workflows/ccache.env

      - name: Build AxioLight Copter
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ ! -d libraries/AP_HAL_ChibiOS/hwdef/AXIOLIGHT ]; then
            echo "AXIOLIGHT hwdef is not present in this branch; skipping AxioLight build."
            exit 0
          fi
          PATH="/github/home/.local/bin:$PATH"
          ./waf configure --board AXIOLIGHT
          ./waf copter
          ccache -s
          ccache -z

      - name: Upload AxioLight failure artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fail-axiolight-copter
          path: /tmp/buildlogs
          retention-days: 14
