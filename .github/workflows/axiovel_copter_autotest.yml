name: Axiovel Copter autotest

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - 'AVCopter*'
      - 'AVCopter/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  copter-sitl:
    name: Copter SITL smoke
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, axio-sitl]
    timeout-minutes: 180
    env:
      # Container jobs use /github/home rather than the runner account's home.
      # An explicit location lets actions/cache and pip agree on the same path.
      PIP_CACHE_DIR: /github/home/.cache/pip
    container:
      image: ardupilot/ardupilot-dev-base:v0.1.3
      options: --privileged --cap-add=SYS_PTRACE --security-opt apparmor=unconfined --security-opt seccomp=unconfined

    steps:
      - name: Recover workspace ownership
        run: |
          set -euo pipefail
          workspace="$GITHUB_WORKSPACE"
          if [[ -z "$workspace" || "$workspace" == / || ! -d "$workspace" ]]; then
            echo "::error::Refusing to change ownership of unsafe workspace: $workspace"
            exit 1
          fi
          chown -R "$(id -u):$(id -g)" "$workspace"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-pip-ardupilot-dev-base-v0.1.3-${{ hashFiles('.github/workflows/axiovel-sitl-requirements.txt', 'modules/mavlink/pymavlink/requirements.txt', 'modules/mavlink/pymavlink/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pip-ardupilot-dev-base-v0.1.3-

      - name: Install SITL Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PIP_CACHE_DIR"
          python3 -m pip cache dir
          python3 -m pip install --user --progress-bar off \
            --requirement .github/workflows/axiovel-sitl-requirements.txt
          # Use the pymavlink revision pinned by this ArduPilot checkout so the
          # test tooling and generated MAVLink definitions cannot drift apart.
          python3 -m pip install --user --progress-bar off \
            ./modules/mavlink/pymavlink
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          python3 -c 'import MAVProxy, dronecan, geocoder, pymavlink'

      - name: Register problem matchers
        run: |
          echo "::add-matcher::.github/problem-matchers/gcc.json"
          echo "::add-matcher::.github/problem-matchers/python.json"
          echo "::add-matcher::.github/problem-matchers/autotestwarn.json"
          echo "::add-matcher::.github/problem-matchers/autotestfail.json"

      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        run: |
          NOW=$(date -u +"%F-%T")
          echo "timestamp=${NOW}" >> "$GITHUB_OUTPUT"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ github.workflow }}-ccache-base-sitl-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
          restore-keys: |
            ${{ github.workflow }}-ccache-base-sitl-
            ${{ github.workflow }}-ccache-base-

      - name: Setup ccache
        run: |
          . .github/workflows/ccache.env

      - name: Run Copter SITL smoke tests
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          PATH="/github/home/.local/bin:$PATH"
          Tools/autotest/autotest.py \
            --show-test-timings \
            --junit \
            --waf-configure-args="--debug" \
            build.Copter \
            test.Copter.ArmFeatures \
            test.Copter.SetHome \
            test.Copter.InitialMode \
            test.Copter.LoiterToAlt \
            test.Copter.MAV_CMD_CONDITION_YAW

      - name: Upload SITL failure artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fail-copter-sitl-smoke
          path: |
            /tmp/buildlogs
            ${{ github.workspace }}/logs
            ${{ github.workspace }}/ap-*.core
            ${{ github.workspace }}/core.*
            ${{ github.workspace }}/dumpstack.sh_*
            ${{ github.workspace }}/dumpcore.sh_*
          retention-days: 14

  axiolight-build:
    name: AxioLight Copter build (${{ matrix.board }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, axio-sitl]
    timeout-minutes: 90
    container: ardupilot/ardupilot-dev-chibios:v0.1.3
    strategy:
      fail-fast: false
      matrix:
        board:
          - AXIOLIGHT-REVA
          - AXIOLIGHT-REVB

    steps:
      - name: Recover workspace ownership
        run: |
          set -euo pipefail
          workspace="$GITHUB_WORKSPACE"
          if [[ -z "$workspace" || "$workspace" == / || ! -d "$workspace" ]]; then
            echo "::error::Refusing to change ownership of unsafe workspace: $workspace"
            exit 1
          fi
          chown -R "$(id -u):$(id -g)" "$workspace"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Register problem matchers
        run: |
          echo "::add-matcher::.github/problem-matchers/gcc.json"
          echo "::add-matcher::.github/problem-matchers/python.json"

      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        run: |
          NOW=$(date -u +"%F-%T")
          echo "timestamp=${NOW}" >> "$GITHUB_OUTPUT"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ github.workflow }}-ccache-chibios-${{ matrix.board }}-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
          restore-keys: |
            ${{ github.workflow }}-ccache-chibios-${{ matrix.board }}-
            ${{ github.workflow }}-ccache-chibios-

      - name: Setup ccache
        run: |
          . .github/workflows/ccache.env

      - name: Build AxioLight Copter
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          PATH="/github/home/.local/bin:$PATH"
          ./waf configure --board ${{ matrix.board }}
          ./waf copter
          ccache -s
          ccache -z

      - name: Upload AxioLight failure artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fail-axiolight-copter-${{ matrix.board }}
          path: /tmp/buildlogs
          retention-days: 14
