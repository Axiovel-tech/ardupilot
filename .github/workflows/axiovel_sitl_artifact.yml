name: Axiovel SITL artifact

# Publishes the AVCopter SITL binary so a machine can run the simulated
# production stack without a recursive submodule checkout (~560 MB) and a full
# build. Consumers download it, chmod +x (artifact zips drop the executable
# bit) and point ARDUPILOT_SITL at it -- exactly as AxioStack already does for
# rtls-link-zephyr's native_sim binaries.
#
# Deliberately separate from axiovel_copter_autotest.yml. That workflow is the
# test gate and runs the autotest matrix on pull requests; this one runs on
# push so that the merge commit AxioStack pins has a retrievable artifact,
# which is what `gh run list --commit <pin>` needs to find. Keeping them apart
# means a push pays for one build instead of the full matrix.

on:
  push:
    branches:
      - 'AVCopter*'
      - 'AVCopter/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sitl-copter:
    name: Build and publish Copter SITL
    runs-on: [self-hosted, Linux, X64, axio-sitl]
    timeout-minutes: 90
    container:
      image: ardupilot/ardupilot-dev-base:v0.1.3
      options: --privileged --cap-add=SYS_PTRACE --security-opt apparmor=unconfined --security-opt seccomp=unconfined

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Register problem matchers
        run: |
          echo "::add-matcher::.github/problem-matchers/gcc.json"
          echo "::add-matcher::.github/problem-matchers/python.json"

      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        run: |
          NOW=$(date -u +"%F-%T")
          echo "timestamp=${NOW}" >> "$GITHUB_OUTPUT"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ github.workflow }}-ccache-sitl-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
          restore-keys: |
            ${{ github.workflow }}-ccache-sitl-

      - name: Setup ccache
        run: |
          . .github/workflows/ccache.env

      - name: Build Copter SITL
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          PATH="/github/home/.local/bin:$PATH"
          # No --debug: this is a distributable binary, not the autotest build.
          ./waf configure --board sitl
          ./waf copter
          ccache -s
          ccache -z

      # Publishing a binary that cannot start on the consumer's machine would
      # replace "build it yourself" with a worse problem, so the two failure
      # modes that survive a successful compile are checked here: a truncated
      # or non-ELF output, and a shared library the build container has but a
      # plain host does not. The full ldd listing is logged either way, so the
      # portability question has an answer on the record rather than an
      # assumption.
      - name: Verify the SITL binary
        shell: bash
        run: |
          set -euo pipefail
          bin=build/sitl/bin/arducopter
          test -x "$bin" || { echo "::error::$bin is missing or not executable"; exit 1; }
          file "$bin"
          file "$bin" | grep -q ELF \
            || { echo "::error::$bin is not an ELF executable"; exit 1; }
          echo "--- ldd ---"
          ldd "$bin" || true
          if ldd "$bin" 2>/dev/null | grep -q 'not found'; then
            echo "::error::$bin has unresolved shared libraries:"
            ldd "$bin" | grep 'not found'
            exit 1
          fi

      - name: Stage SITL artifact
        shell: bash
        run: |
          set -euo pipefail
          out="artifacts/sitl-copter"
          mkdir -p "${out}"
          cp build/sitl/bin/arducopter "${out}/arducopter"
          cat > "${out}/manifest.json" <<EOF
          {
            "vehicle": "copter",
            "board": "sitl",
            "git_sha": "${GITHUB_SHA}",
            "git_ref": "${GITHUB_REF_NAME}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat "${out}/manifest.json"

      - name: Upload Copter SITL binary
        uses: actions/upload-artifact@v4
        with:
          name: sitl-copter
          path: artifacts/sitl-copter
          if-no-files-found: error
          retention-days: 30

      - name: Upload build failure logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fail-sitl-copter-build
          path: /tmp/buildlogs
          retention-days: 14

  axiolight-revb-copter:
    name: Build and publish AXIOLIGHT-REVB Copter
    runs-on: [self-hosted, Linux, X64, axio-sitl]
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Register problem matchers
        run: |
          echo "::add-matcher::.github/problem-matchers/gcc.json"
          echo "::add-matcher::.github/problem-matchers/python.json"

      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        run: |
          NOW=$(date -u +"%F-%T")
          echo "timestamp=${NOW}" >> "$GITHUB_OUTPUT"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache-ardupilot-docker
          key: ${{ github.workflow }}-ccache-axiolight-revb-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
          restore-keys: |
            ${{ github.workflow }}-ccache-axiolight-revb-

      - name: Setup ccache
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="$HOME/.ccache-ardupilot-docker"
          mkdir -p "$cache_dir"
          {
            echo "base_dir = $GITHUB_WORKSPACE"
            echo "compression = true"
            echo "compression_level = 6"
            echo "max_size = 400M"
          } > "$cache_dir/ccache.conf"

      - name: Build bootloader and Copter firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/buildlogs"
          docker run --rm --cpus=2 --memory=6g \
            -u "$(id -u):$(id -g)" \
            -e CCACHE_DIR=/tmp/ccache \
            -e GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v "$HOME/.ccache-ardupilot-docker:/tmp/ccache" \
            -v "$RUNNER_TEMP/buildlogs:/tmp/buildlogs" \
            -w "$GITHUB_WORKSPACE" \
            ardupilot/ardupilot-dev-chibios:v0.1.3 \
            bash -c '
              set -euo pipefail
              git config --global --add safe.directory "$GITHUB_WORKSPACE"

              ./waf configure --board AXIOLIGHT-REVB --bootloader --no-submodule-update
              ./waf bootloader
              mkdir -p artifacts/axiolight-revb-bootloader
              cp build/AXIOLIGHT-REVB/bin/AP_Bootloader.bin \
                artifacts/axiolight-revb-bootloader/bootloader.bin
              cp build/AXIOLIGHT-REVB/bin/AP_Bootloader.bin \
                Tools/bootloaders/AXIOLIGHT-REVB_bl.bin

              ./waf configure --board AXIOLIGHT-REVB --no-submodule-update
              ./waf copter
              mkdir -p artifacts/axiolight-revb-copter
              cp build/AXIOLIGHT-REVB/bin/arducopter.apj \
                artifacts/axiolight-revb-copter/arducopter.apj
              python3 Tools/scripts/verify_embedded_bootloader.py \
                --apj artifacts/axiolight-revb-copter/arducopter.apj \
                --romfs-header build/AXIOLIGHT-REVB/ap_romfs_embedded.h \
                --bootloader artifacts/axiolight-revb-bootloader/bootloader.bin

              ccache -s
              ccache -z
            '

      - name: Stage firmware manifests
        shell: bash
        run: |
          set -euo pipefail
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          app_sha=$(sha256sum artifacts/axiolight-revb-copter/arducopter.apj | cut -d' ' -f1)
          bootloader_sha=$(sha256sum artifacts/axiolight-revb-bootloader/bootloader.bin | cut -d' ' -f1)

          cat > artifacts/axiolight-revb-copter/manifest.json <<EOF
          {
            "vehicle": "copter",
            "board": "AXIOLIGHT-REVB",
            "board_id": 1177,
            "git_sha": "${GITHUB_SHA}",
            "git_ref": "${GITHUB_REF_NAME}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_url": "${run_url}",
            "built_at": "${built_at}",
            "file": "arducopter.apj",
            "sha256": "${app_sha}"
          }
          EOF

          cat > artifacts/axiolight-revb-bootloader/manifest.json <<EOF
          {
            "vehicle": "bootloader",
            "board": "AXIOLIGHT-REVB",
            "board_id": 1177,
            "git_sha": "${GITHUB_SHA}",
            "git_ref": "${GITHUB_REF_NAME}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_url": "${run_url}",
            "built_at": "${built_at}",
            "file": "bootloader.bin",
            "sha256": "${bootloader_sha}"
          }
          EOF

      - name: Upload AXIOLIGHT-REVB Copter firmware
        uses: actions/upload-artifact@v4
        with:
          name: axiolight-revb-copter
          path: artifacts/axiolight-revb-copter
          if-no-files-found: error
          retention-days: 30

      - name: Upload AXIOLIGHT-REVB bootloader
        uses: actions/upload-artifact@v4
        with:
          name: axiolight-revb-bootloader
          path: artifacts/axiolight-revb-bootloader
          if-no-files-found: error
          retention-days: 30

      - name: Upload build failure logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fail-axiolight-revb-copter-build
          path: ${{ runner.temp }}/buildlogs
          retention-days: 14
